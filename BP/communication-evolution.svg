<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Header -->
  <text x="500" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Reimagining Communication</text>
  
  <!-- Two main sections: Traditional vs Intelligence Synthesis -->
  <text x="250" y="100" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Traditional Meetings</text>
  <text x="750" y="100" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#6A3DE8">Intelligence Synthesis Sessions</text>
  
  <!-- Left: Traditional Meeting visualization -->
  <rect x="100" y="120" width="300" height="200" rx="10" ry="10" fill="#ffffff" stroke="#ddd" stroke-width="2"/>
  
  <!-- Traditional meeting participants around table -->
  <circle cx="175" cy="180" r="25" fill="#f1f3f5" stroke="#ddd" stroke-width="1"/> <!-- person 1 -->
  <circle cx="250" cy="150" r="25" fill="#f1f3f5" stroke="#ddd" stroke-width="1"/> <!-- person 2 -->
  <circle cx="325" cy="180" r="25" fill="#f1f3f5" stroke="#ddd" stroke-width="1"/> <!-- person 3 -->
  <circle cx="175" cy="260" r="25" fill="#f1f3f5" stroke="#ddd" stroke-width="1"/> <!-- person 4 -->
  <circle cx="325" cy="260" r="25" fill="#f1f3f5" stroke="#ddd" stroke-width="1"/> <!-- person 5 -->
  <circle cx="250" cy="290" r="25" fill="#f1f3f5" stroke="#ddd" stroke-width="1"/> <!-- person 6 -->
  
  <!-- Linear conversation flow -->
  <line x1="175" y1="180" x2="250" y2="150" stroke="#ddd" stroke-width="2"/>
  <line x1="250" y1="150" x2="325" y2="180" stroke="#ddd" stroke-width="2"/>
  <line x1="325" y1="180" x2="325" y2="260" stroke="#ddd" stroke-width="2"/>
  <line x1="325" y1="260" x2="250" y2="290" stroke="#ddd" stroke-width="2"/>
  <line x1="250" y1="290" x2="175" y2="260" stroke="#ddd" stroke-width="2"/>
  <line x1="175" y1="260" x2="175" y2="180" stroke="#ddd" stroke-width="2"/>
  
  <!-- Meeting table -->
  <ellipse cx="250" cy="220" rx="100" ry="60" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Traditional meeting limitations -->
  <rect x="125" y="330" width="250" height="25" rx="12.5" ry="12.5" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="347" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Linear, Single-Thread Communication</text>
  
  <rect x="125" y="365" width="250" height="25" rx="12.5" ry="12.5" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="382" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Dominant Voices &amp; Status Hierarchies</text>
  
  <rect x="125" y="400" width="250" height="25" rx="12.5" ry="12.5" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="417" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Information Asymmetry</text>
  
  <rect x="125" y="435" width="250" height="25" rx="12.5" ry="12.5" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="452" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Limited by Time Constraints</text>
  
  <!-- Right: Intelligence Synthesis Session -->
  <rect x="600" y="120" width="300" height="200" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="2"/>
  
  <!-- Central AGI node -->
  <circle cx="750" cy="220" r="40" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="2"/>
  <text x="750" y="225" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6A3DE8">AGI</text>
  
  <!-- Human participants -->
  <circle cx="675" cy="150" r="25" fill="#f1f3f5" stroke="#6A3DE8" stroke-width="1"/> <!-- person 1 -->
  <circle cx="750" cy="150" r="25" fill="#f1f3f5" stroke="#6A3DE8" stroke-width="1"/> <!-- person 2 -->
  <circle cx="825" cy="150" r="25" fill="#f1f3f5" stroke="#6A3DE8" stroke-width="1"/> <!-- person 3 -->
  <circle cx="650" cy="220" r="25" fill="#f1f3f5" stroke="#6A3DE8" stroke-width="1"/> <!-- person 4 -->
  <circle cx="850" cy="220" r="25" fill="#f1f3f5" stroke="#6A3DE8" stroke-width="1"/> <!-- person 5 -->
  <circle cx="750" cy="290" r="25" fill="#f1f3f5" stroke="#6A3DE8" stroke-width="1"/> <!-- person 6 -->
  
  <!-- Multi-directional communication flows -->
  <line x1="675" y1="150" x2="750" y2="220" stroke="#6A3DE8" stroke-width="2"/>
  <line x1="750" y1="150" x2="750" y2="220" stroke="#6A3DE8" stroke-width="2"/>
  <line x1="825" y1="150" x2="750" y2="220" stroke="#6A3DE8" stroke-width="2"/>
  <line x1="650" y1="220" x2="750" y2="220" stroke="#6A3DE8" stroke-width="2"/>
  <line x1="850" y1="220" x2="750" y2="220" stroke="#6A3DE8" stroke-width="2"/>
  <line x1="750" y1="290" x2="750" y2="220" stroke="#6A3DE8" stroke-width="2"/>
  
  <!-- Parallel thought streams visualization -->
  <path d="M680,170 C700,185 720,175 730,190" fill="none" stroke="#33A8FF" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M750,175 C770,195 770,215 750,235" fill="none" stroke="#33FF57" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M820,170 C800,190 800,205 815,230" fill="none" stroke="#FFCC33" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M670,220 C700,240 720,230 740,250" fill="none" stroke="#FF5733" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M830,220 C800,245 795,265 780,275" fill="none" stroke="#9900CC" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Intelligence synthesis advantages -->
  <rect x="625" y="330" width="250" height="25" rx="12.5" ry="12.5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="750" y="347" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Multi-dimensional Communication</text>
  
  <rect x="625" y="365" width="250" height="25" rx="12.5" ry="12.5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="750" y="382" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Dynamic Consensus Building</text>
  
  <rect x="625" y="400" width="250" height="25" rx="12.5" ry="12.5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="750" y="417" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Cognitive Bias Neutralization</text>
  
  <rect x="625" y="435" width="250" height="25" rx="12.5" ry="12.5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="750" y="452" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Continuous Intelligence Evolution</text>
  
  <!-- Central flow connecting the two approaches -->
  <rect x="425" y="180" width="150" height="140" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="2"/>
  <text x="500" y="200" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Transformation</text>
  
  <!-- Transformation process steps -->
  <rect x="440" y="215" width="120" height="25" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="232" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Pre-session Cultivation</text>
  
  <rect x="440" y="245" width="120" height="25" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="262" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Parallel Thought Streams</text>
  
  <rect x="440" y="275" width="120" height="25" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="292" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Real-time Visualization</text>
  
  <!-- Arrows connecting traditional to transformation to synthesis -->
  <path d="M350,220 L415,220" fill="none" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="415,220 405,215 410,220 405,225" fill="#ddd"/>
  
  <path d="M575,220 L590,220" fill="none" stroke="#6A3DE8" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="590,220 580,215 585,220 580,225" fill="#6A3DE8"/>
  
  <!-- Bottom section: Key insights -->
  <rect x="100" y="480" width="800" height="100" rx="10" ry="10" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="505" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Intelligence Synthesis Outcomes</text>
  
  <!-- Four key outcome metrics -->
  <rect x="150" y="525" width="150" height="40" rx="5" ry="5" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="225" y="545" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">87%</text>
  <text x="225" y="560" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#666">Increased Perspective Integration</text>
  
  <rect x="350" y="525" width="150" height="40" rx="5" ry="5" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="425" y="545" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">72%</text>
  <text x="425" y="560" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#666">Reduced Decision Time</text>
  
  <rect x="550" y="525" width="150" height="40" rx="5" ry="5" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="625" y="545" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">3.4x</text>
  <text x="625" y="560" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#666">More Creative Solutions</text>
  
  <rect x="750" y="525" width="150" height="40" rx="5" ry="5" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="825" y="545" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">68%</text>
  <text x="825" y="560" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#666">Higher Team Alignment</text>
</svg>