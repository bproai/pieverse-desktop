<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Header -->
  <text x="500" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Intergenerational Wisdom Transfer</text>
  
  <!-- Timeline -->
  <line x1="100" y1="300" x2="900" y2="300" stroke="#6A3DE8" stroke-width="4"/>
  
  <!-- Timeline markers -->
  <circle cx="250" cy="300" r="15" fill="#6A3DE8"/>
  <text x="250" y="335" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Generation 1</text>
  
  <circle cx="500" cy="300" r="15" fill="#6A3DE8"/>
  <text x="500" y="335" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Generation 2</text>
  
  <circle cx="750" cy="300" r="15" fill="#6A3DE8"/>
  <text x="750" y="335" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Generation 3</text>
  
  <!-- Generation 1 Person -->
  <circle cx="250" cy="200" r="50" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <path d="M230,180 C240,175 260,175 270,180" fill="none" stroke="#333" stroke-width="2"/> <!-- smile -->
  <circle cx="235" cy="185" r="3" fill="#333"/> <!-- eye -->
  <circle cx="265" cy="185" r="3" fill="#333"/> <!-- eye -->
  <path d="M225,150 Q250,130 275,150" fill="none" stroke="#333" stroke-width="2"/> <!-- hair -->
  
  <!-- Generation 1 Knowledge -->
  <rect x="150" y="120" width="200" height="50" rx="10" ry="10" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="145" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Life Experiences</text>
  <text x="250" y="165" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Stories, Wisdom, Values</text>
  
  <!-- PieVerse Node for Generation 1 -->
  <rect x="330" y="200" width="100" height="50" rx="25" ry="25" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="2"/>
  <text x="380" y="230" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6A3DE8">PieVerse</text>
  
  <!-- Capture Process -->
  <path d="M300,200 L330,200" fill="none" stroke="#6A3DE8" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="330,200 320,195 325,200 320,205" fill="#6A3DE8"/>
  
  <!-- Generation 1 Legacy Elements -->
  <rect x="120" y="370" width="80" height="30" rx="15" ry="15" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="160" y="390" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Stories</text>
  
  <rect x="210" y="370" width="80" height="30" rx="15" ry="15" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="250" y="390" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Values</text>
  
  <rect x="300" y="370" width="80" height="30" rx="15" ry="15" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="340" y="390" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Personality</text>
  
  <!-- Generation 2 Person -->
  <circle cx="500" cy="200" r="50" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <path d="M480,180 C490,175 510,175 520,180" fill="none" stroke="#333" stroke-width="2"/> <!-- smile -->
  <circle cx="485" cy="185" r="3" fill="#333"/> <!-- eye -->
  <circle cx="515" cy="185" r="3" fill="#333"/> <!-- eye -->
  <path d="M475,155 Q500,135 525,155" fill="none" stroke="#333" stroke-width="2"/> <!-- hair -->
  
  <!-- PieVerse Node for Generation 2 -->
  <rect x="420" y="250" width="160" height="30" rx="15" ry="15" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="2"/>
  <text x="500" y="270" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6A3DE8">PieVerse + Gen 1 Wisdom</text>
  
  <!-- Knowledge Transfer to Generation 2 -->
  <path d="M380,225 C400,240 420,250 420,250" fill="none" stroke="#6A3DE8" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="420,250 410,245 415,250 412,257" fill="#6A3DE8"/>
  
  <!-- Generation 2 Learning -->
  <rect x="400" y="120" width="200" height="50" rx="10" ry="10" fill="rgba(51,168,255,0.1)" stroke="#33A8FF" stroke-width="1"/>
  <text x="500" y="145" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Interactive Learning</text>
  <text x="500" y="165" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Questions, Exploration, Growth</text>
  
  <!-- Generation 2 Legacy Extension -->
  <rect x="370" y="370" width="80" height="30" rx="15" ry="15" fill="rgba(51,168,255,0.1)" stroke="#33A8FF" stroke-width="1"/>
  <text x="410" y="390" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Adaptation</text>
  
  <rect x="460" y="370" width="80" height="30" rx="15" ry="15" fill="rgba(51,168,255,0.1)" stroke="#33A8FF" stroke-width="1"/>
  <text x="500" y="390" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Extension</text>
  
  <rect x="550" y="370" width="80" height="30" rx="15" ry="15" fill="rgba(51,168,255,0.1)" stroke="#33A8FF" stroke-width="1"/>
  <text x="590" y="390" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Questions</text>
  
  <!-- Generation 3 Person -->
  <circle cx="750" cy="200" r="50" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <path d="M730,180 C740,175 760,175 770,180" fill="none" stroke="#333" stroke-width="2"/> <!-- smile -->
  <circle cx="735" cy="185" r="3" fill="#333"/> <!-- eye -->
  <circle cx="765" cy="185" r="3" fill="#333"/> <!-- eye -->
  <path d="M725,150 Q750,130 775,150" fill="none" stroke="#333" stroke-width="2"/> <!-- hair -->
  
  <!-- PieVerse Node for Generation 3 -->
  <rect x="670" y="250" width="160" height="30" rx="15" ry="15" fill="rgba(106, 61, 232, 0.3)" stroke="#6A3DE8" stroke-width="2"/>
  <text x="750" y="270" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6A3DE8">PieVerse + Gen 1 &amp; 2 Wisdom</text>
  <!-- Knowledge Transfer to Generation 3 -->
  <path d="M580,250 C610,250 630,250 670,250" fill="none" stroke="#6A3DE8" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="670,250 660,245 665,250 660,255" fill="#6A3DE8"/>
  
  <!-- Generation 3 Future Growth -->
  <rect x="650" y="120" width="200" height="50" rx="10" ry="10" fill="rgba(51,255,87,0.1)" stroke="#33FF57" stroke-width="1"/>
  <text x="750" y="145" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Future Context</text>
  <text x="750" y="165" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">New Challenges, Modern Application</text>
  
  <!-- Generation 3 Wisdom Application -->
  <rect x="620" y="370" width="80" height="30" rx="15" ry="15" fill="rgba(51,255,87,0.1)" stroke="#33FF57" stroke-width="1"/>
  <text x="660" y="390" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Evolution</text>
  
  <rect x="710" y="370" width="80" height="30" rx="15" ry="15" fill="rgba(51,255,87,0.1)" stroke="#33FF57" stroke-width="1"/>
  <text x="750" y="390" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Application</text>
  
  <rect x="800" y="370" width="80" height="30" rx="15" ry="15" fill="rgba(51,255,87,0.1)" stroke="#33FF57" stroke-width="1"/>
  <text x="840" y="390" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Innovation</text>
  
  <!-- Wisdom Types -->
  <rect x="100" y="430" width="800" height="150" rx="10" ry="10" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="455" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Types of Transferable Wisdom</text>
  
  <!-- Wisdom categories -->
  <rect x="150" y="480" width="150" height="80" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="225" y="500" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Personal Stories</text>
  <text x="225" y="520" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Formative experiences</text>
  <text x="225" y="535" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Historical context</text>
  <text x="225" y="550" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Emotional connections</text>
  
  <rect x="350" y="480" width="150" height="80" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="425" y="500" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Decision Frameworks</text>
  <text x="425" y="520" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Problem-solving approaches</text>
  <text x="425" y="535" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Value prioritization</text>
  <text x="425" y="550" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Risk assessment methods</text>
  
  <rect x="550" y="480" width="150" height="80" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="625" y="500" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Personal Philosophy</text>
  <text x="625" y="520" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Ethical frameworks</text>
  <text x="625" y="535" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Life principles</text>
  <text x="625" y="550" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Personal values</text>
  
  <rect x="750" y="480" width="150" height="80" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="825" y="500" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Cultural Heritage</text>
  <text x="825" y="520" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Family traditions</text>
  <text x="825" y="535" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Cultural knowledge</text>
  <text x="825" y="550" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Ancestral connections</text>
</svg>