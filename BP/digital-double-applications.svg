<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Header -->
  <text x="500" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Digital Double Applications</text>
  <text x="500" y="80" font-family="Inter, sans-serif" font-size="18" font-style="italic" text-anchor="middle" fill="#666">Professional representation with progressive autonomy</text>
  
  <!-- Four application scenarios -->
  <rect x="50" y="100" width="220" height="280" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <rect x="290" y="100" width="220" height="280" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <rect x="530" y="100" width="220" height="280" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <rect x="770" y="100" width="220" height="280" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  
  <!-- Scenario 1: Meeting Attendance -->
  <text x="160" y="125" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Meeting Attendance</text>
  
  <!-- Meeting scenario illustration -->
  <rect x="75" y="140" width="170" height="110" rx="5" ry="5" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  
  <!-- Meeting table with people -->
  <rect x="95" y="170" width="130" height="60" rx="5" ry="5" fill="#FFFFFF" stroke="#6A3DE8" stroke-width="1"/>
  
  <!-- People at meeting -->
  <circle cx="120" cy="180" r="10" fill="#EEEEEE" stroke="#333333" stroke-width="1"/>
  <circle cx="150" cy="180" r="10" fill="#EEEEEE" stroke="#333333" stroke-width="1"/>
  <circle cx="180" cy="180" r="10" fill="#EEEEEE" stroke="#333333" stroke-width="1"/>
  <circle cx="200" cy="200" r="10" fill="#EEEEEE" stroke="#333333" stroke-width="1"/>
  <circle cx="170" cy="220" r="10" fill="#EEEEEE" stroke="#333333" stroke-width="1"/>
  
  <!-- Digital double at meeting -->
  <circle cx="120" cy="220" r="10" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="115" cy="215" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" fill="#6A3DE8">DD</text>
  
  <!-- Capabilities list -->
  <text x="160" y="270" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Capabilities</text>
  <text x="70" y="290" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Takes comprehensive notes</text>
  <text x="70" y="310" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Makes decisions within parameters</text>
  <text x="70" y="330" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Represents your perspective</text>
  <text x="70" y="350" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Flags issues requiring your attention</text>
  
  <!-- Scenario 2: Client Communication -->
  <text x="400" y="125" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Client Communication</text>
  
  <!-- Email scenario illustration -->
  <rect x="315" y="140" width="170" height="110" rx="5" ry="5" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  
  <!-- Email window -->
  <rect x="325" y="150" width="150" height="90" rx="5" ry="5" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="325" y="150" width="150" height="20" rx="5" ry="5" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1"/>
  <circle cx="335" cy="160" r="5" fill="#FF6B6B"/>
  <circle cx="350" cy="160" r="5" fill="#FFD93D"/>
  <circle cx="365" cy="160" r="5" fill="#6BCB77"/>
  
  <!-- Email text lines -->
  <line x1="335" y1="185" x2="465" y2="185" stroke="#EEEEEE" stroke-width="2"/>
  <line x1="335" y1="200" x2="465" y2="200" stroke="#EEEEEE" stroke-width="2"/>
  <line x1="335" y1="215" x2="425" y2="215" stroke="#EEEEEE" stroke-width="2"/>
  
  <!-- Digital double icon -->
  <circle cx="465" cy="225" r="10" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="465" y="227" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#6A3DE8">DD</text>
  
  <!-- Capabilities list -->
  <text x="400" y="270" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Capabilities</text>
  <text x="310" y="290" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Responds using your writing style</text>
  <text x="310" y="310" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Handles routine inquiries</text>
  <text x="310" y="330" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Maintains relationship continuity</text>
  <text x="310" y="350" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Escalates complex matters to you</text>
  
  <!-- Scenario 3: Preliminary Consultations -->
