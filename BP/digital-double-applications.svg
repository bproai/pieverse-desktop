  <!-- Consultation setting -->
  <rect x="565" y="160" width="150" height="70" rx="5" ry="5" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Client figure -->
  <circle cx="595" cy="195" r="15" fill="#EEEEEE" stroke="#333333" stroke-width="1"/>
  <line x1="595" y1="210" x2="595" y2="220" stroke="#333333" stroke-width="1"/>
  <line x1="595" y1="210" x2="590" y2="215" stroke="#333333" stroke-width="1"/>
  <line x1="595" y1="210" x2="600" y2="215" stroke="#333333" stroke-width="1"/>
  
  <!-- Digital double consultant -->
  <circle cx="685" cy="195" r="15" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="1"/>
  <line x1="685" y1="210" x2="685" y2="220" stroke="#6A3DE8" stroke-width="1"/>
  <line x1="685" y1="210" x2="680" y2="215" stroke="#6A3DE8" stroke-width="1"/>
  <line x1="685" y1="210" x2="690" y2="215" stroke="#6A3DE8" stroke-width="1"/>
  <text x="685" y="195" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#6A3DE8">DD</text>
  
  <!-- Conversation indicator -->
  <path d="M615,185 Q640,175 665,185" stroke="#6A3DE8" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
  <path d="M665,195 Q640,205 615,195" stroke="#333333" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
  
  <!-- Capabilities list -->
  <text x="640" y="270" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Capabilities</text>
  <text x="550" y="290" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Applies your expertise framework</text>
  <text x="550" y="310" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Provides initial problem assessment</text>
  <text x="550" y="330" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Qualifies leads for your attention</text>
  <text x="550" y="350" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Extends your consulting capacity</text>
  
  <!-- Scenario 4: Cross-timezone Collaboration -->
