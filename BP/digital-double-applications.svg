  <!-- Time zones -->
  <text x="830" y="185" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">NY 9AM</text>
  <text x="880" y="175" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">LDN 2PM</text>
  <text x="930" y="185" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">TYO 10PM</text>
  
  <!-- Sleeping human -->
  <rect x="920" y="205" width="20" height="10" rx="5" ry="5" fill="#EEEEEE" stroke="#333333" stroke-width="1"/>
  <text x="930" y="220" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" fill="#333">💤</text>
  
  <!-- Working digital double -->
  <circle cx="830" cy="200" r="10" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="830" y="203" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" fill="#6A3DE8">DD</text>
  
  <!-- Capabilities list -->
  <text x="880" y="270" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Capabilities</text>
  <text x="790" y="290" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Works while you sleep</text>
  <text x="790" y="310" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Handles international collaboration</text>
  <text x="790" y="330" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Maintains workflow continuity</text>
  <text x="790" y="350" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Eliminates timezone barriers</text>
  
  <!-- Implementation Framework -->
  <rect x="50" y="400" width="900" height="180" rx="10" ry="10" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="425" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Implementation Framework</text>
  
  <!-- Progressive Autonomy Model -->
  <rect x="75" y="445" width="250" height="115" rx="5" ry="5" fill="#FFFFFF" stroke="#6A3DE8" stroke-width="1"/>
  <text x="200" y="465" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Progressive Autonomy Model</text>
  
  <!-- Autonomy progression -->
  <rect x="95" y="485" width="210" height="30" rx="5" ry="5" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="95" y="485" width="40" height="30" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <rect x="135" y="485" width="50" height="30" rx="0" ry="0" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="1"/>
  <rect x="185" y="485" width="60" height="30" rx="0" ry="0" fill="rgba(106, 61, 232, 0.3)" stroke="#6A3DE8" stroke-width="1"/>
  <rect x="245" y="485" width="60" height="30" rx="0" ry="5" fill="rgba(106, 61, 232, 0.5)" stroke="#6A3DE8" stroke-width="1"/>
  
  <text x="115" y="505" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Supervised</text>
  <text x="160" y="505" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Guided</text>
  <text x="215" y="505" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Semi-autonomous</text>
  <text x="275" y="505" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Autonomous</text>
  
  <text x="200" y="535" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#666">Gradually expand capabilities as the system</text>
  <text x="200" y="550" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#666">demonstrates reliable alignment with your style</text>
  
  <!-- Transparency Framework -->
  <rect x="375" y="445" width="250" height="115" rx="5" ry="5" fill="#FFFFFF" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="465" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Transparency Framework</text>
  
  <!-- Transparency elements -->
  <rect x="395" y="485" width="90" height="50" rx="5" ry="5" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <text x="440" y="510" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Digital Double</text>
  <text x="440" y="525" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Disclosure</text>
  
  <rect x="515" y="485" width="90" height="50" rx="5" ry="5" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <text x="560" y="510" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Activity