<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Header -->
  <text x="500" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">24/7 Human-AGI Fusion Organization</text>
  
  <!-- Traditional vs Fusion comparison -->
  <text x="250" y="100" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Traditional Organization</text>
  <text x="750" y="100" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#6A3DE8">Fusion Organization</text>
  
  <!-- Left: Traditional 9-5 organization visualization -->
  <rect x="120" y="120" width="260" height="200" rx="10" ry="10" fill="#ffffff" stroke="#ddd" stroke-width="2"/>
  
  <!-- 24-hour clock for traditional -->
  <circle cx="250" cy="220" r="80" fill="none" stroke="#ddd" stroke-width="2"/>
  <circle cx="250" cy="220" r="75" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Active working hours (9-5) -->
  <path d="M250,220 L250,145 A75,75 0 0,1 325,220 Z" fill="rgba(51,168,255,0.3)" stroke="#33A8FF" stroke-width="1"/>
  <path d="M250,220 L325,220 A75,75 0 0,1 250,295 Z" fill="rgba(51,168,255,0.3)" stroke="#33A8FF" stroke-width="1"/>
  
  <!-- Inactive hours -->
  <path d="M250,220 L250,295 A75,75 0 1,1 250,145 Z" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Clock markers -->
  <line x1="250" y1="150" x2="250" y2="160" stroke="#333" stroke-width="2"/> <!-- 12 -->
  <text x="250" y="145" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">12</text>
  
  <line x1="320" y1="220" x2="310" y2="220" stroke="#333" stroke-width="2"/> <!-- 3 -->
  <text x="325" y="224" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">3</text>
  
  <line x1="250" y1="290" x2="250" y2="280" stroke="#333" stroke-width="2"/> <!-- 6 -->
  <text x="250" y="300" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">6</text>
  
  <line x1="180" y1="220" x2="190" y2="220" stroke="#333" stroke-width="2"/> <!-- 9 -->
  <text x="175" y="224" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">9</text>
  
  <!-- Work hours labels -->
  <text x="290" y="180" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#33A8FF">Working Hours</text>
  <text x="210" y="260" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FF5733">Idle Time</text>
  
  <!-- Traditional downsides -->
  <rect x="150" y="330" width="200" height="25" rx="12.5" ry="12.5" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="347" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Limited to ~40 hours/week</text>
  
  <rect x="150" y="365" width="200" height="25" rx="12.5" ry="12.5" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="382" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Productivity fluctuations</text>
  
  <rect x="150" y="400" width="200" height="25" rx="12.5" ry="12.5" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="417" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Interrupted momentum</text>
  
  <rect x="150" y="435" width="200" height="25" rx="12.5" ry="12.5" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="452" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Geographical limitations</text>
  
  <!-- Right: 24/7 Fusion Organization -->
  <rect x="620" y="120" width="260" height="200" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="2"/>
  
  <!-- 24-hour clock for fusion -->
  <circle cx="750" cy="220" r="80" fill="none" stroke="#6A3DE8" stroke-width="2"/>
  <circle cx="750" cy="220" r="75" fill="none" stroke="#6A3DE8" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Human active hours (better distributed) -->
  <path d="M750,220 L750,155 A65,65 0 0,1 815,220 Z" fill="rgba(51,168,255,0.3)" stroke="#33A8FF" stroke-width="1"/>
  <path d="M750,220 L807,265 A65,65 0 0,1 750,285 Z" fill="rgba(51,168,255,0.3)" stroke="#33A8FF" stroke-width="1"/>
  <path d="M750,220 L685,260 A65,65 0 0,1 695,180 Z" fill="rgba(51,168,255,0.3)" stroke="#33A8FF" stroke-width="1"/>
  
  <!-- AGI active hours (continuous) -->
  <circle cx="750" cy="220" r="60" fill="none" stroke="#6A3DE8" stroke-width="10" stroke-opacity="0.3"/>
  
  <!-- Clock markers -->
  <line x1="750" y1="150" x2="750" y2="160" stroke="#333" stroke-width="2"/> <!-- 12 -->
  <text x="750" y="145" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">12</text>
  
  <line x1="820" y1="220" x2="810" y2="220" stroke="#333" stroke-width="2"/> <!-- 3 -->
  <text x="825" y="224" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">3</text>
  
  <line x1="750" y1="290" x2="750" y2="280" stroke="#333" stroke-width="2"/> <!-- 6 -->
  <text x="750" y="300" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">6</text>
  
  <line x1="680" y1="220" x2="690" y2="220" stroke="#333" stroke-width="2"/> <!-- 9 -->
  <text x="675" y="224" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">9</text>
  
  <!-- Work hours labels -->
  <text x="790" y="195" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#33A8FF">Human Focus</text>
  <text x="710" y="195" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#33A8FF">Human Focus</text>
  <text x="790" y="245" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#33A8FF">Human Focus</text>
  <text x="750" y="220" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6A3DE8">AGI 24/7</text>
  
  <!-- Fusion advantages -->
  <rect x="650" y="330" width="200" height="25" rx="12.5" ry="12.5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="750" y="347" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Continuous 168 hours/week</text>
  
  <rect x="650" y="365" width="200" height="25" rx="12.5" ry="12.5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="750" y="382" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Optimized human performance</text>
  
  <rect x="650" y="400" width="200" height="25" rx="12.5" ry="12.5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="750" y="417" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Uninterrupted momentum</text>
  
  <rect x="650" y="435" width="200" height="25" rx="12.5" ry="12.5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="750" y="452" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Global operation capability</text>
  
  <!-- Central Handoff System -->
  <rect x="400" y="180" width="200" height="220" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="2"/>
  <text x="500" y="200" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Seamless Handoff System</text>
  
  <!-- Handoff elements -->
  <rect x="420" y="220" width="160" height="30" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="240" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Context Preservation</text>
  
  <rect x="420" y="260" width="160" height="30" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="280" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Priority Flagging</text>
  
  <rect x="420" y="300" width="160" height="30" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="320" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Decision Boundaries</text>
  
  <rect x="420" y="340" width="160" height="30" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="360" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Autonomous Action</text>
  
  <!-- Arrows connecting traditional to fusion -->
  <path d="M310,220 L390,220" fill="none" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="390,220 380,215 385,220 380,225" fill="#ddd"/>
  
  <path d="M510,220 L610,220" fill="none" stroke="#6A3DE8" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="610,220 600,215 605,220 600,225" fill="#6A3DE8"/>
  
  <!-- Performance metrics at bottom -->
  <rect x="100" y="480" width="800" height="100" rx="10" ry="10" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="505" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Operational Efficiency Metrics</text>
  
  <!-- Metrics visualization -->
  <line x1="150" y1="540" x2="350" y2="540" stroke="#ddd" stroke-width="1"/>
  <rect x="150" y="535" width="40" height="10" rx="5" ry="5" fill="#ddd"/>
  <rect x="150" y="535" width="200" height="10" rx="5" ry="5" fill="#6A3DE8"/>
  <text x="360" y="543" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">4.2x Productivity Increase</text>
  
  <line x1="500" y1="540" x2="700" y2="540" stroke="#ddd" stroke-width="1"/>
  <rect x="500" y="535" width="40" height="10" rx="5" ry="5" fill="#ddd"/>
  <rect x="500" y="535" width="150" height="10" rx="5" ry="5" fill="#6A3DE8"/>
  <text x="710" y="543" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">3.8x Development Speed</text>
  
  <line x1="150" y1="560" x2="350" y2="560" stroke="#ddd" stroke-width="1"/>
  <rect x="150" y="555" width="40" height="10" rx="5" ry="5" fill="#ddd"/>
  <rect x="150" y="555" width="180" height="10" rx="5" ry="5" fill="#6A3DE8"/>
  <text x="360" y="563" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">65% Reduced Time-to-Market</text>
  
  <line x1="500" y1="560" x2="700" y2="560" stroke="#ddd" stroke-width="1"/>
  <rect x="500" y="555" width="40" height="10" rx="5" ry="5" fill="#ddd"/>
  <rect x="500" y="555" width="170" height="10" rx="5" ry="5" fill="#6A3DE8"/>
  <text x="710" y="563" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">74% Human Stress Reduction</text>
</svg>