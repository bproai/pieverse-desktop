<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Header -->
  <text x="500" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Building Bridges Between Humanity and AGI</text>
  
  <!-- Left side: Human representation -->
  <ellipse cx="250" cy="300" rx="150" ry="180" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- Human brain outline -->
  <path d="M200,200 C230,180 270,180 300,200 C325,220 325,260 300,280 C290,290 290,310 300,320 C325,340 325,380 300,400 C270,420 230,420 200,400 C175,380 175,340 200,320 C210,310 210,290 200,280 C175,260 175,220 200,200 Z" fill="rgba(255,200,200,0.3)" stroke="#ff7b7b" stroke-width="2"/>
  
  <!-- Human representation elements -->
  <circle cx="250" cy="230" r="15" fill="#333"/> <!-- eye -->
  <path d="M220,280 Q250,320 280,280" fill="none" stroke="#333" stroke-width="2"/> <!-- smile -->
  <path d="M180,350 L320,350" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/> <!-- dividing line -->
  
  <!-- Human thought concepts -->
  <text x="190" y="380" font-family="Inter, sans-serif" font-size="12" fill="#333">• Intuition</text>
  <text x="190" y="400" font-family="Inter, sans-serif" font-size="12" fill="#333">• Creativity</text>
  <text x="190" y="420" font-family="Inter, sans-serif" font-size="12" fill="#333">• Ethics</text>
  <text x="260" y="380" font-family="Inter, sans-serif" font-size="12" fill="#333">• Empathy</text>
  <text x="260" y="400" font-family="Inter, sans-serif" font-size="12" fill="#333">• Wisdom</text>
  <text x="260" y="420" font-family="Inter, sans-serif" font-size="12" fill="#333">• Context</text>
  
  <!-- Human label -->
  <text x="250" y="470" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Humanity</text>
  
  <!-- Right side: AGI representation -->
  <ellipse cx="750" cy="300" rx="150" ry="180" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- Circuit pattern for AGI -->
  <path d="M700,220 L730,220 L730,240 L760,240 L760,260 L800,260" fill="none" stroke="#6A3DE8" stroke-width="2"/>
  <path d="M700,260 L720,260 L720,280 L780,280 L780,300 L800,300" fill="none" stroke="#6A3DE8" stroke-width="2"/>
  <path d="M700,300 L740,300 L740,320 L770,320 L770,340 L800,340" fill="none" stroke="#6A3DE8" stroke-width="2"/>
  <path d="M700,340 L730,340 L730,360 L750,360 L750,380 L800,380" fill="none" stroke="#6A3DE8" stroke-width="2"/>
  
  <!-- AGI nodes -->
  <circle cx="730" cy="220" r="5" fill="#6A3DE8"/>
  <circle cx="760" cy="240" r="5" fill="#6A3DE8"/>
  <circle cx="720" cy="260" r="5" fill="#6A3DE8"/>
  <circle cx="780" cy="280" r="5" fill="#6A3DE8"/>
  <circle cx="740" cy="300" r="5" fill="#6A3DE8"/>
  <circle cx="770" cy="320" r="5" fill="#6A3DE8"/>
  <circle cx="730" cy="340" r="5" fill="#6A3DE8"/>
  <circle cx="750" cy="360" r="5" fill="#6A3DE8"/>
  
  <!-- AGI digital eye -->
  <circle cx="750" cy="230" r="25" fill="none" stroke="#6A3DE8" stroke-width="2"/>
  <circle cx="750" cy="230" r="15" fill="#6A3DE8"/>
  <circle cx="750" cy="230" r="7" fill="#ffffff"/>
  
  <path d="M680,350 L820,350" stroke="#6A3DE8" stroke-width="1" stroke-dasharray="5,5"/> <!-- dividing line -->
  
  <!-- AGI capabilities -->
  <text x="690" y="380" font-family="Inter, sans-serif" font-size="12" fill="#333">• Pattern Recognition</text>
  <text x="690" y="400" font-family="Inter, sans-serif" font-size="12" fill="#333">• Knowledge Integration</text>
  <text x="690" y="420" font-family="Inter, sans-serif" font-size="12" fill="#333">• Scalable Processing</text>
  <text x="690" y="440" font-family="Inter, sans-serif" font-size="12" fill="#333">• Continuous Learning</text>
  
  <!-- AGI label -->
  <text x="750" y="470" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">AGI</text>
  
  <!-- Central bridge -->
  <path d="M400,300 C450,260 550,260 600,300" fill="none" stroke="#6A3DE8" stroke-width="8" stroke-opacity="0.6"/>
  <path d="M400,320 C450,360 550,360 600,320" fill="none" stroke="#6A3DE8" stroke-width="8" stroke-opacity="0.6"/>
  
  <!-- Bridge supports -->
  <rect x="390" y="300" width="20" height="20" fill="#6A3DE8"/>
  <rect x="590" y="300" width="20" height="20" fill="#6A3DE8"/>
  
  <!-- Bridge crossbars -->
  <line x1="425" y1="290" x2="425" y2="330" stroke="#6A3DE8" stroke-width="3"/>
  <line x1="450" y1="285" x2="450" y2="335" stroke="#6A3DE8" stroke-width="3"/>
  <line x1="475" y1="280" x2="475" y2="340" stroke="#6A3DE8" stroke-width="3"/>
  <line x1="500" y1="280" x2="500" y2="340" stroke="#6A3DE8" stroke-width="3"/>
  <line x1="525" y1="280" x2="525" y2="340" stroke="#6A3DE8" stroke-width="3"/>
  <line x1="550" y1="285" x2="550" y2="335" stroke="#6A3DE8" stroke-width="3"/>
  <line x1="575" y1="290" x2="575" y2="330" stroke="#6A3DE8" stroke-width="3"/>
  
  <!-- Bridge label -->
  <rect x="450" y="240" width="100" height="30" rx="15" ry="15" fill="rgba(106, 61, 232, 0.2)"/>
  <text x="500" y="260" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">PieVerse</text>
  
  <!-- Bidirectional arrows to show collaboration -->
  <path d="M380,270 L400,270 L400,260 L420,280 L400,300 L400,290 L380,290 Z" fill="#333"/>
  <path d="M620,270 L600,270 L600,260 L580,280 L600,300 L600,290 L620,290 Z" fill="#333"/>
  
  <!-- Bottom text boxes for key features -->
  <rect x="150" y="520" width="160" height="40" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="230" y="545" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Knowledge Bridge</text>
  
  <rect x="330" y="520" width="160" height="40" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="410" y="545" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Co-creation Environment</text>
  
  <rect x="510" y="520" width="160" height="40" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="590" y="545" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Perspective Enhancement</text>
  
  <rect x="690" y="520" width="160" height="40" rx="5" ry="5" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="770" y="545" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Discovery Acceleration</text>
  
  <!-- Reason ONE AI company info -->
  <text x="500" y="580" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">© 2024 Reason ONE AI • Mountain View, California • reasonone.ai</text>
</svg>