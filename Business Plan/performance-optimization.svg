  <rect x="100" y="380" width="300" height="150" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="2"/>
  <text x="250" y="400" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Stock Trading Enhancement</text>
  
  <!-- Trading visualization -->
