<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Header -->
  <text x="500" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Performance Optimization System</text>
  
  <!-- Main sections background -->
  <rect x="50" y="90" width="900" height="210" rx="10" ry="10" fill="#f1f3f5" stroke="#ddd" stroke-width="1"/>
  <rect x="50" y="320" width="900" height="240" rx="10" ry="10" fill="#f1f3f5" stroke="#ddd" stroke-width="1"/>
  
  <!-- Left side: Biometric monitoring -->
  <text x="200" y="120" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Biometric Monitoring</text>
  
  <!-- Human figure with biometric points -->
  <ellipse cx="200" cy="200" rx="40" ry="60" fill="#ffffff" stroke="#6A3DE8" stroke-width="2"/>
  <circle cx="200" cy="160" r="20" fill="#ffffff" stroke="#6A3DE8" stroke-width="2"/> <!-- head -->
  
  <!-- Biometric points -->
  <circle cx="200" cy="180" r="5" fill="#FF5733" stroke="#ffffff" stroke-width="1"/> <!-- brain/cognitive -->
  <circle cx="185" cy="190" r="3" fill="#FF5733" stroke="#ffffff" stroke-width="1"/> <!-- eye tracking -->
  <circle cx="215" cy="190" r="3" fill="#FF5733" stroke="#ffffff" stroke-width="1"/> <!-- eye tracking -->
  
  <circle cx="200" cy="210" r="5" fill="#33A8FF" stroke="#ffffff" stroke-width="1"/> <!-- heart/HRV -->
  <circle cx="180" cy="200" r="4" fill="#33A8FF" stroke="#ffffff" stroke-width="1"/> <!-- breathing -->
  <circle cx="170" cy="220" r="3" fill="#33A8FF" stroke="#ffffff" stroke-width="1"/> <!-- stress hormones -->
  
  <circle cx="190" cy="235" r="4" fill="#33FF57" stroke="#ffffff" stroke-width="1"/> <!-- posture -->
  <circle cx="210" cy="235" r="4" fill="#33FF57" stroke="#ffffff" stroke-width="1"/> <!-- posture -->
  
  <circle cx="180" cy="250" r="3" fill="#FFCC33" stroke="#ffffff" stroke-width="1"/> <!-- muscle tension -->
  <circle cx="220" cy="250" r="3" fill="#FFCC33" stroke="#ffffff" stroke-width="1"/> <!-- muscle tension -->
  
  <!-- Biometric data streams -->
  <path d="M210,180 L240,170 L270,185 L300,165" fill="none" stroke="#FF5733" stroke-width="2"/> <!-- brain activity -->
  <path d="M210,210 L240,200 L255,220 L270,190 L285,220 L300,210" fill="none" stroke="#33A8FF" stroke-width="2"/> <!-- heart rate -->
  <path d="M220,235 L240,235 L255,245 L270,235 L285,245 L300,235" fill="none" stroke="#33FF57" stroke-width="2"/> <!-- posture -->
  <path d="M220,250 L240,260 L255,240 L270,260 L285,250 L300,245" fill="none" stroke="#FFCC33" stroke-width="2"/> <!-- muscle tension -->
  
  <!-- Wearable device icon -->
  <rect x="120" y="200" width="30" height="20" rx="5" ry="5" fill="#6A3DE8"/>
  <rect x="125" y="195" width="20" height="30" rx="5" ry="5" fill="#6A3DE8"/>
  <circle cx="135" cy="210" r="7" fill="#ffffff"/>
  
  <!-- Right side: Cognitive Assessment -->
  <text x="600" y="120" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Cognitive Assessment</text>
  
  <!-- Brain mapping visualization -->
  <ellipse cx="600" cy="200" rx="100" ry="70" fill="#ffffff" stroke="#6A3DE8" stroke-width="2"/>
  
  <!-- Cognitive regions -->
  <path d="M570,160 C590,140 610,140 630,160" fill="rgba(255,87,51,0.2)" stroke="#FF5733" stroke-width="2"/>
  <text x="600" y="150" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Decision Making</text>
  
  <path d="M570,180 C580,165 620,165 630,180" fill="rgba(51,168,255,0.2)" stroke="#33A8FF" stroke-width="2"/>
  <text x="600" y="175" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Emotional Regulation</text>
  
  <path d="M550,200 C560,220 640,220 650,200" fill="rgba(51,255,87,0.2)" stroke="#33FF57" stroke-width="2"/>
  <text x="600" y="210" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Focus &amp; Attention</text>
  
  <path d="M550,230 C575,260 625,260 650,230" fill="rgba(255,204,51,0.2)" stroke="#FFCC33" stroke-width="2"/>
  <text x="600" y="245" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Pattern Recognition</text>
  
  <!-- Cognitive performance metrics -->
  <line x1="720" y1="160" x2="800" y2="160" stroke="#ddd" stroke-width="1"/>
  <rect x="720" y="155" width="50" height="10" rx="5" ry="5" fill="#FF5733"/>
  <text x="820" y="165" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">Decision Speed</text>
  
  <line x1="720" y1="180" x2="800" y2="180" stroke="#ddd" stroke-width="1"/>
  <rect x="720" y="175" width="35" height="10" rx="5" ry="5" fill="#33A8FF"/>
  <text x="820" y="185" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">Stress Resilience</text>
  
  <line x1="720" y1="200" x2="800" y2="200" stroke="#ddd" stroke-width="1"/>
  <rect x="720" y="195" width="65" height="10" rx="5" ry="5" fill="#33FF57"/>
  <text x="820" y="205" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">Sustained Attention</text>
  
  <line x1="720" y1="220" x2="800" y2="220" stroke="#ddd" stroke-width="1"/>
  <rect x="720" y="215" width="80" height="10" rx="5" ry="5" fill="#FFCC33"/>
  <text x="820" y="225" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">Market Pattern Recognition</text>
  
  <!-- Personal Enhancement Programs -->
  <text x="250" y="350" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Personalized Enhancement Programs</text>
  
