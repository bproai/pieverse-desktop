  <circle cx="210" cy="465" r="6" fill="#ffffff" stroke="#FF5733" stroke-width="2"/>
  <circle cx="270" cy="430" r="6" fill="#ffffff" stroke="#FF5733" stroke-width="2"/>
  <circle cx="330" cy="440" r="6" fill="#ffffff" stroke="#FF5733" stroke-width="2"/>
  
  <!-- Enhancement modules -->
  <rect x="130" y="420" width="80" height="25" rx="5" ry="5" fill="rgba(255,87,51,0.2)" stroke="#FF5733" stroke-width="1"/>
  <text x="170" y="435" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Decision Speed</text>
  
  <rect x="220" y="420" width="80" height="25" rx="5" ry="5" fill="rgba(51,168,255,0.2)" stroke="#33A8FF" stroke-width="1"/>
  <text x="260" y="435" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Emotional Control</text>
  
  <rect x="310" y="420" width="80" height="25" rx="5" ry="5" fill="rgba(255,204,51,0.2)" stroke="#FFCC33" stroke-width="1"/>
  <text x="350" y="435" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Pattern Training</text>
  
  <!-- Real-time AGI Support -->
  <text x="750" y="350" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Real-time AGI Support</text>
  
  <rect x="600" y="380" width="300" height="150" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="2"/>
  <line x1="750" y1="380" x2="750" y2="530" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Human side -->
  <text x="675" y="400" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Human</text>
  
  <!-- Human metrics -->
  <rect x="625" y="415" width="100" height="20" rx="5" ry="5" fill="rgba(255,87,51,0.2)" stroke="#FF5733" stroke-width="1"/>
  <text x="675" y="430" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Heart Rate: Elevated</text>
  
  <rect x="625" y="445" width="100" height="20" rx="5" ry="5" fill="rgba(51,168,255,0.2)" stroke="#33A8FF" stroke-width="1"/>
  <text x="675" y="460" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Cortisol: Rising</text>
  
  <rect x="625" y="475" width="100" height="20" rx="5" ry="5" fill="rgba(255,204,51,0.2)" stroke="#FFCC33" stroke-width="1"/>
  <text x="675" y="490" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Focus: Narrowing</text>
  
  <!-- Decision status -->
