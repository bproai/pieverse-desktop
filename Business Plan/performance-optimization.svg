  <text x="675" y="520" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">DECISION PENDING</text>
  
  <!-- AGI side -->
  <text x="825" y="400" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">AGI Support</text>
  
  <!-- AGI support elements -->
  <rect x="775" y="415" width="100" height="20" rx="5" ry="5" fill="rgba(106,61,232,0.2)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="825" y="430" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Historical Pattern Match</text>
  
  <rect x="775" y="445" width="100" height="20" rx="5" ry="5" fill="rgba(106,61,232,0.2)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="825" y="460" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Risk Calculation</text>
  
  <rect x="775" y="475" width="100" height="20" rx="5" ry="5" fill="rgba(106,61,232,0.2)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="825" y="490" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Emotional Regulation</text>
  
  <!-- Recommendation -->
  <rect x="775" y="505" width="100" height="20" rx="10" ry="10" fill="#6A3DE8"/>
  <text x="825" y="520" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">WAIT RECOMMENDED</text>
  
  <!-- Success metrics at bottom -->
  <text x="500" y="585" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Performance Improvement Metrics</text>
  
  <!-- Metrics visualization -->
  <line x1="200" y1="570" x2="400" y2="570" stroke="#ddd" stroke-width="1"/>
  <rect x="200" y="565" width="50" height="10" rx="5" ry="5" fill="#ddd"/>
  <rect x="200" y="565" width="150" height="10" rx="5" ry="5" fill="#6A3DE8"/>
  <text x="410" y="570" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">Trading Performance +38%</text>
  
  <line x1="600" y1="570" x2="800" y2="570" stroke="#ddd" stroke-width="1"/>
  <rect x="600" y="565" width="50" height="10" rx="5" ry="5" fill="#ddd"/>
  <rect x="600" y="565" width="120" height="10" rx="5" ry="5" fill="#6A3DE8"/>
  <text x="810" y="570" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">Stress Reduction 28%</text>
</svg>