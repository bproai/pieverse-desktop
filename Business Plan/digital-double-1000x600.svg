<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Header -->
  <text x="500" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">PiEVerse as Digital Double</text>
  <text x="500" y="80" font-family="Inter, sans-serif" font-size="18" font-style="italic" text-anchor="middle" fill="#666">Extending your presence beyond biological constraints</text>
  
  <!-- Two main sections -->
  <rect x="50" y="110" width="440" height="320" rx="10" ry="10" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  <rect x="510" y="110" width="440" height="320" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  
  <!-- Left side: Personal Constraints -->
  <text x="270" y="135" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Human Limitations</text>
  
  <!-- Person with limited capacity visuals -->
  <circle cx="160" cy="220" r="60" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <!-- Person stick figure -->
  <circle cx="160" cy="190" r="20" fill="#ffffff" stroke="#333" stroke-width="2"/> <!-- head -->
  <line x1="160" y1="210" x2="160" y2="240" stroke="#333" stroke-width="2"/> <!-- body -->
  <line x1="160" y1="240" x2="140" y2="270" stroke="#333" stroke-width="2"/> <!-- leg -->
  <line x1="160" y1="240" x2="180" y2="270" stroke="#333" stroke-width="2"/> <!-- leg -->
  <line x1="160" y1="220" x2="140" y2="230" stroke="#333" stroke-width="2"/> <!-- arm -->
  <line x1="160" y1="220" x2="180" y2="230" stroke="#333" stroke-width="2"/> <!-- arm -->
  
  <!-- Limitation bubbles around person -->
  <ellipse cx="100" cy="170" rx="40" ry="25" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="100" y="175" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FF5733">Sleep</text>
  
  <ellipse cx="190" cy="150" rx="45" ry="25" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="190" y="155" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FF5733">Time Limits</text>
  
  <ellipse cx="220" cy="190" rx="50" ry="25" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="220" y="195" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FF5733">Single Location</text>
  
  <ellipse cx="100" cy="230" rx="40" ry="25" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="100" y="235" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FF5733">Fatigue</text>
  
  <!-- Work demands illustration -->
  <rect x="100" y="280" width="300" height="100" rx="10" ry="10" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="250" y="305" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Increasing Demands</text>
  
  <!-- Calendar icons -->
  <rect x="130" y="320" width="40" height="40" rx="5" ry="5" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="330" x2="170" y2="330" stroke="#333" stroke-width="1"/>
  <text x="150" y="350" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#333">📅</text>
  
  <rect x="190" y="320" width="40" height="40" rx="5" ry="5" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <line x1="190" y1="330" x2="230" y2="330" stroke="#333" stroke-width="1"/>
  <text x="210" y="350" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#333">📝</text>
  
  <rect x="250" y="320" width="40" height="40" rx="5" ry="5" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <line x1="250" y1="330" x2="290" y2="330" stroke="#333" stroke-width="1"/>
  <text x="270" y="350" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#333">👥</text>
  
  <rect x="310" y="320" width="40" height="40" rx="5" ry="5" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <line x1="310" y1="330" x2="350" y2="330" stroke="#333" stroke-width="1"/>
  <text x="330" y="350" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#333">📊</text>
  
  <!-- Limitation summary -->
  <text x="250" y="390" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Professional &amp; Economic Constraints</text>
  <text x="250" y="410" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Limited economic potential due to finite time and energy</text>
  
  <!-- Right side: Digital Double Solution -->
  <text x="730" y="135" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">PiEVerse Digital Double</text>
  
  <!-- Digital double visualization -->
  <circle cx="640" cy="220" r="60" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="2"/>
  <!-- Human figure -->
  <circle cx="620" cy="210" r="15" fill="#ffffff" stroke="#333" stroke-width="1.5"/> <!-- head -->
  <line x1="620" y1="225" x2="620" y2="245" stroke="#333" stroke-width="1.5"/> <!-- body -->
  <line x1="620" y1="245" x2="610" y2="260" stroke="#333" stroke-width="1.5"/> <!-- leg -->
  <line x1="620" y1="245" x2="630" y2="260" stroke="#333" stroke-width="1.5"/> <!-- leg -->
  <line x1="620" y1="235" x2="610" y2="240" stroke="#333" stroke-width="1.5"/> <!-- arm -->
  <line x1="620" y1="235" x2="630" y2="240" stroke="#333" stroke-width="1.5"/> <!-- arm -->
  
  <!-- Digital avatar -->
  <circle cx="660" cy="210" r="15" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="1.5"/> <!-- head -->
  <line x1="660" y1="225" x2="660" y2="245" stroke="#6A3DE8" stroke-width="1.5"/> <!-- body -->
  <line x1="660" y1="245" x2="650" y2="260" stroke="#6A3DE8" stroke-width="1.5"/> <!-- leg -->
  <line x1="660" y1="245" x2="670" y2="260" stroke="#6A3DE8" stroke-width="1.5"/> <!-- leg -->
  <line x1="660" y1="235" x2="650" y2="240" stroke="#6A3DE8" stroke-width="1.5"/> <!-- arm -->
  <line x1="660" y1="235" x2="670" y2="240" stroke="#6A3DE8" stroke-width="1.5"/> <!-- arm -->
  
  <!-- Connecting glow between human and digital double -->
  <ellipse cx="640" cy="220" rx="35" ry="25" fill="rgba(106, 61, 232, 0.1)" stroke="none"/>
  <text x="640" y="225" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" fill="#6A3DE8">SYNCED</text>
  
  <!-- Multiplication effect -->
  <g transform="translate(750, 220)">
    <circle cx="0" cy="0" r="35" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
    <!-- Digital avatar 1 -->
    <circle cx="0" cy="-10" r="10" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="1"/> <!-- head -->
    <line x1="0" y1="0" x2="0" y2="15" stroke="#6A3DE8" stroke-width="1"/> <!-- body -->
    <line x1="0" y1="15" x2="-8" y2="25" stroke="#6A3DE8" stroke-width="1"/> <!-- leg -->
    <line x1="0" y1="15" x2="8" y2="25" stroke="#6A3DE8" stroke-width="1"/> <!-- leg -->
    <line x1="0" y1="5" x2="-8" y2="10" stroke="#6A3DE8" stroke-width="1"/> <!-- arm -->
    <line x1="0" y1="5" x2="8" y2="10" stroke="#6A3DE8" stroke-width="1"/> <!-- arm -->
    <text x="0" y="-20" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" fill="#6A3DE8">MEETING</text>
  </g>
  
  <g transform="translate(830, 220)">
    <circle cx="0" cy="0" r="35" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
    <!-- Digital avatar 2 -->
    <circle cx="0" cy="-10" r="10" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="1"/> <!-- head -->
    <line x1="0" y1="0" x2="0" y2="15" stroke="#6A3DE8" stroke-width="1"/> <!-- body -->
    <line x1="0" y1="15" x2="-8" y2="25" stroke="#6A3DE8" stroke-width="1"/> <!-- leg -->
    <line x1="0" y1="15" x2="8" y2="25" stroke="#6A3DE8" stroke-width="1"/> <!-- leg -->
    <line x1="0" y1="5" x2="-8" y2="10" stroke="#6A3DE8" stroke-width="1"/> <!-- arm -->
    <line x1="0" y1="5" x2="8" y2="10" stroke="#6A3DE8" stroke-width="1"/> <!-- arm -->
    <text x="0" y="-20" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" fill="#6A3DE8">EMAIL</text>
  </g>
  
  <g transform="translate(790, 310)">
    <circle cx="0" cy="0" r="35" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
    <!-- Digital avatar 3 -->
    <circle cx="0" cy="-10" r="10" fill="rgba(106, 61, 232, 0.2)" stroke="#6A3DE8" stroke-width="1"/> <!-- head -->
    <line x1="0" y1="0" x2="0" y2="15" stroke="#6A3DE8" stroke-width="1"/> <!-- body -->
    <line x1="0" y1="15" x2="-8" y2="25" stroke="#6A3DE8" stroke-width="1"/> <!-- leg -->
    <line x1="0" y1="15" x2="8" y2="25" stroke="#6A3DE8" stroke-width="1"/> <!-- leg -->
    <line x1="0" y1="5" x2="-8" y2="10" stroke="#6A3DE8" stroke-width="1"/> <!-- arm -->
    <line x1="0" y1="5" x2="8" y2="10" stroke="#6A3DE8" stroke-width="1"/> <!-- arm -->
    <text x="0" y="-20" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" fill="#6A3DE8">CONSULT</text>
  </g>
  
  <!-- Connecting lines from original to doubles -->
  <line x1="680" y1="220" x2="715" y2="220" stroke="#6A3DE8" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="680" y1="220" x2="790" y2="280" stroke="#6A3DE8" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="680" y1="220" x2="795" y2="220" stroke="#6A3DE8" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- Digital double capabilities list -->
  <rect x="540" y="360" width="380" height="70" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="730" y="380" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Digital Double Capabilities</text>
  
  <text x="570" y="400" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Represents you at meetings while you focus elsewhere</text>
  <text x="570" y="420" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Responds to routine emails using your writing style</text>
  <text x="570" y="440" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">• Makes decisions aligned with your preferences and values</text>
  
  <!-- Bottom section: Economic Benefits -->
  <rect x="50" y="450" width="900" height="130" rx="10" ry="10" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="475" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Economic &amp; Professional Benefits</text>
  
  <!-- Four benefit boxes -->
  <rect x="80" y="495" width="190" height="65" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="175" y="520" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Multiplied Impact</text>
  <text x="175" y="540" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Extend your expertise and</text>
  <text x="175" y="555" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">presence beyond time limits</text>
  
  <rect x="300" y="495" width="190" height="65" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="395" y="520" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">24/7 Availability</text>
  <text x="395" y="540" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Maintain professional presence</text>
  <text x="395" y="555" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">even while you sleep or recover</text>
  
  <rect x="520" y="495" width="190" height="65" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="615" y="520" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Focus Optimization</text>
  <text x="615" y="540" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Delegate routine tasks while you</text>
  <text x="615" y="555" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">focus on highest-value activities</text>
  
  <rect x="740" y="495" width="190" height="65" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="835" y="520" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Economic Growth</text>
  <text x="835" y="540" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Increase earning potential without</text>
  <text x="835" y="555" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">sacrificing wellbeing</text>
</svg>