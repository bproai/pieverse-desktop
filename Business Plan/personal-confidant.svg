<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Header -->
  <text x="500" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">PieVerse as Personal Confidant</text>
  <text x="500" y="80" font-family="Inter, sans-serif" font-size="18" font-style="italic" text-anchor="middle" fill="#666">"当局者迷，旁观者清" - Those involved are confused, while bystanders see clearly</text>
  
  <!-- Two main sections -->
  <rect x="50" y="110" width="440" height="320" rx="10" ry="10" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  <rect x="510" y="110" width="440" height="320" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  
  <!-- Left side: Social Intelligence Analysis -->
  <text x="270" y="135" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Social Intelligence Analysis</text>
  
  <!-- Person with confused expression -->
  <circle cx="160" cy="250" r="60" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <path d="M145,260 Q160,250 175,260" fill="none" stroke="#333" stroke-width="2"/> <!-- confused mouth -->
  <circle cx="145" cy="230" r="5" fill="#333"/> <!-- eye -->
  <circle cx="175" cy="230" r="5" fill="#333"/> <!-- eye -->
  <path d="M140,215 L150,210" stroke="#333" stroke-width="2"/> <!-- confused eyebrow -->
  <path d="M170,210 L180,215" stroke="#333" stroke-width="2"/> <!-- confused eyebrow -->
  
  <!-- Social situation bubble -->
  <ellipse cx="250" cy="200" rx="120" ry="60" fill="rgba(255,87,51,0.1)" stroke="#FF5733" stroke-width="1"/>
  <text x="250" y="190" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Complex Social Situation</text>
  <text x="250" y="210" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Interpersonal dynamics, cultural</text>
  <text x="250" y="230" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">nuances, emotional undercurrents</text>
  
  <!-- Question marks -->
  <text x="160" y="180" font-family="Inter, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#FF5733">?</text>
  
  <!-- PieVerse as confidant -->
  <circle cx="380" cy="250" r="60" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="2"/>
  <text x="380" y="240" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#6A3DE8">PieVerse</text>
  <text x="380" y="260" font-family="Inter, sans-serif" font-size="14" text-anchor="middle" fill="#6A3DE8">Confidant</text>
  
  <!-- Connection lines -->
  <line x1="220" y1="250" x2="320" y2="250" stroke="#6A3DE8" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="320,250 310,245 315,250 310,255" fill="#6A3DE8"/>
  
  <line x1="250" y1="200" x2="180" y2="200" stroke="#FF5733" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Social intelligence elements -->
  <rect x="100" y="330" width="80" height="80" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="140" y="360" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Pattern</text>
  <text x="140" y="375" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Recognition</text>
  <text x="140" y="395" font-family="Inter, sans-serif" font-size="24" text-anchor="middle" fill="#6A3DE8">👁️</text>
  
  <rect x="200" y="330" width="80" height="80" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="240" y="360" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Emotional</text>
  <text x="240" y="375" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Analysis</text>
  <text x="240" y="395" font-family="Inter, sans-serif" font-size="24" text-anchor="middle" fill="#6A3DE8">❤️</text>
  
  <rect x="300" y="330" width="80" height="80" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="340" y="360" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Cultural</text>
  <text x="340" y="375" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Context</text>
  <text x="340" y="395" font-family="Inter, sans-serif" font-size="24" text-anchor="middle" fill="#6A3DE8">🌏</text>
  
  <rect x="400" y="330" width="80" height="80" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="440" y="360" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Perspective</text>
  <text x="440" y="375" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Shift</text>
  <text x="440" y="395" font-family="Inter, sans-serif" font-size="24" text-anchor="middle" fill="#6A3DE8">🔄</text>
  
  <!-- Right side: Confidant Conversation -->
  <text x="730" y="135" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Judgment-Free Dialogue</text>
  
  <!-- Chat interface -->
  <rect x="540" y="160" width="380" height="250" rx="10" ry="10" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  
  <!-- Human message -->
  <rect x="560" y="180" width="250" height="60" rx="10" ry="10" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="580" y="200" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#333">You</text>
  <text x="580" y="220" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">I feel like my colleague is upset with me,</text>
  <text x="580" y="235" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#666">but I'm not sure what I did wrong.</text>
  
  <!-- PieVerse message 1 -->
  <rect x="650" y="250" width="250" height="70" rx="10" ry="10" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="670" y="270" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#6A3DE8">PieVerse</text>
  <text x="670" y="290" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">I notice you mentioned last week that you</text>
  <text x="670" y="305" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">took credit for a team project during the</text>
  <text x="670" y="320" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">meeting. Could that be related?</text>
  
  <!-- PieVerse message 2 -->
  <rect x="650" y="330" width="250" height="60" rx="10" ry="10" fill="rgba(106, 61, 232, 0.1)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="670" y="350" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#6A3DE8">PieVerse</text>
  <text x="670" y="370" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">Let me help you see this from your</text>
  <text x="670" y="385" font-family="Inter, sans-serif" font-size="12" text-anchor="start" fill="#333">colleague's perspective...</text>
  
  <!-- Bottom section: Benefits -->
  <rect x="50" y="450" width="900" height="130" rx="10" ry="10" fill="rgba(106, 61, 232, 0.05)" stroke="#6A3DE8" stroke-width="1"/>
  <text x="500" y="475" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Benefits of PieVerse as Personal Confidant</text>
  
  <!-- Four benefit boxes -->
  <rect x="80" y="495" width="190" height="65" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="175" y="520" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Enhanced EQ</text>
  <text x="175" y="540" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Better social awareness and</text>
  <text x="175" y="555" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">relationship management</text>
  
  <rect x="300" y="495" width="190" height="65" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="395" y="520" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Cultural Navigation</text>
  <text x="395" y="540" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Guidance in unfamiliar</text>
  <text x="395" y="555" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">social and cultural contexts</text>
  
  <rect x="520" y="495" width="190" height="65" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="615" y="520" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Private Reflection</text>
  <text x="615" y="540" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Safe space to process</text>
  <text x="615" y="555" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">complex emotions</text>
  
  <rect x="740" y="495" width="190" height="65" rx="10" ry="10" fill="#ffffff" stroke="#6A3DE8" stroke-width="1"/>
  <text x="835" y="520" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Personalized Growth</text>
  <text x="835" y="540" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">Long-term tracking of patterns</text>
  <text x="835" y="555" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#666">and personal development</text>
</svg>