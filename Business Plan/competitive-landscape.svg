<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Header -->
  <text x="500" y="50" font-family="Inter, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Competitive Landscape</text>
  
  <!-- 2x2 Matrix -->
  <rect x="150" y="100" width="700" height="400" fill="white" stroke="#ddd" stroke-width="2" rx="5" ry="5"/>
  
  <!-- Grid lines -->
  <line x1="150" y1="300" x2="850" y2="300" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="500" y1="100" x2="500" y2="500" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Axis labels -->
  <text x="500" y="530" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">AI Integration</text>
  <text x="120" y="300" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90, 120, 300)">Database Support</text>
  
  <!-- Quadrant labels -->
  <text x="325" y="200" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#666">Database Tools</text>
  <text x="675" y="200" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#666">AI-Powered Databases</text>
  <text x="325" y="400" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#666">Basic Tools</text>
  <text x="675" y="400" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#666">AI Assistants</text>
  
  <!-- Axis descriptors -->
  <text x="150" y="520" font-family="Inter, sans-serif" font-size="14" text-anchor="start" fill="#666">Low</text>
  <text x="830" y="520" font-family="Inter, sans-serif" font-size="14" text-anchor="end" fill="#666">High</text>
  <text x="130" y="490" font-family="Inter, sans-serif" font-size="14" text-anchor="middle" fill="#666">Limited</text>
  <text x="130" y="110" font-family="Inter, sans-serif" font-size="14" text-anchor="middle" fill="#666">Comprehensive</text>
  
  <!-- Competitive Positioning Bubbles -->
  <!-- JetBrains DataGrip - high database, low AI -->
  <circle cx="320" cy="150" r="40" fill="rgba(255, 99, 132, 0.2)" stroke="rgba(255, 99, 132, 1)" stroke-width="2"/>
  <text x="320" y="155" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">DataGrip</text>
  
  <!-- MongoDB Compass - medium-high database, low-mid AI -->
  <circle cx="380" cy="220" r="35" fill="rgba(54, 162, 235, 0.2)" stroke="rgba(54, 162, 235, 1)" stroke-width="2"/>
  <text x="380" y="225" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">MongoDB Compass</text>
  
  <!-- GitHub Copilot - low database, high AI -->
  <circle cx="720" cy="420" r="45" fill="rgba(255, 206, 86, 0.2)" stroke="rgba(255, 206, 86, 1)" stroke-width="2"/>
  <text x="720" y="425" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">GitHub Copilot</text>
  
  <!-- VS Code - medium database, medium AI -->
  <circle cx="480" cy="350" r="40" fill="rgba(75, 192, 192, 0.2)" stroke="rgba(75, 192, 192, 1)" stroke-width="2"/>
  <text x="480" y="355" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">VS Code</text>
  
  <!-- ChatGPT - low database, high AI -->
  <circle cx="750" cy="450" r="35" fill="rgba(153, 102, 255, 0.2)" stroke="rgba(153, 102, 255, 1)" stroke-width="2"/>
  <text x="750" y="455" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">ChatGPT</text>
  
  <!-- Jupyter - low-mid database, mid AI -->
  <circle cx="520" cy="380" r="30" fill="rgba(255, 159, 64, 0.2)" stroke="rgba(255, 159, 64, 1)" stroke-width="2"/>
  <text x="520" y="385" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333">Jupyter</text>
  
  <!-- PiEVerse - high database, high AI -->
  <circle cx="720" cy="150" r="50" fill="rgba(106, 61, 232, 0.3)" stroke="rgba(106, 61, 232, 1)" stroke-width="3"/>
  <text x="720" y="155" font-family="Inter, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">PiEVerse</text>
  
  <!-- Callout for PiEVerse -->
  <path d="M720,150 L820,80" stroke="rgba(106, 61, 232, 1)" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <rect x="820" y="50" width="150" height="60" rx="10" ry="10" fill="rgba(106, 61, 232, 0.1)" stroke="rgba(106, 61, 232, 1)" stroke-width="2"/>
  <text x="895" y="75" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">PiEVerse Advantage</text>
  <text x="895" y="95" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">Unique combination of AI</text>
  <text x="895" y="110" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#333">and database capabilities</text>
</svg>