[package]
name = "pieverse-desktop"
version = "0.1.0"
description = "PiEVerse Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "pieverse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["shell"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43.0", features = ["full"] }
mongodb = "3.2.1"
pyo3 = { version = "0.23.4", features = ["auto-initialize"] }
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"