[package]
name = "pieverse"
version = "1.0.0"
description = "πeVerse - Financial Data Analysis Tool"
authors = ["Yunpeng Brian Pan"]
edition = "2021"

[lib]
name = "pieverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.2.5", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43.0", features = ["full"] }
mongodb = "3.2.1"
pyo3 = { version = "0.23.4", features = ["auto-initialize", "extension-module"] }
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "mysql", "json", "chrono", "time", "macros"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }
rusqlite = { version = "0.29.0", features = ["bundled"] }
dirs = "5.0"
# Add these new dependencies
axum = { version = "0.7.4", features = ["json"] }
tower-http = { version = "0.5.1", features = ["cors"] }
tower = { version = "0.4.13", features = ["util"] }
once_cell = "1.19.0"
# Audio processing dependencies
base64 = "0.21.5"
# Whisper API dependencies
reqwest = { version = "0.11", features = ["json", "multipart"] }
# WebRTC utilities (these don't directly implement WebRTC, it's done in the browser)
uuid = { version = "1.4", features = ["v4", "serde"] }
url = "2.4"
cocoa = "0.24"
objc = "0.2"
regex = "1.9.5"
tauri-plugin-clipboard-manager = "2"
tokio-tungstenite = "0.21.0"
futures-util = "0.3.30"
tokio-stream = { version = "0.1.14", features = ["net", "sync"] }
hyper = { version = "0.14", features = ["full"] }
walkdir = "2.3"
async-stream = "0.3"
mcp-client = "0.1.0"
urlencoding = "2.1.0"
zip = "0.6"
image = "0.24"    
arboard = "1.2" 
